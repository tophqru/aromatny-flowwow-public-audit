name: Public bouquet metadata and binary integrity QA
on:
  push:
    branches: [main, review/chatgpt-reference, audit/arena-independent]
    paths:
      - 'catalog/**'
      - 'data/flowwow/items/**'
      - 'scripts/verify_catalog.py'
      - 'scripts/verify_indexed_leads.py'
      - '.github/workflows/catalog-qa.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --quiet 'Pillow>=10,<12'
      - run: python scripts/verify_catalog.py --metadata-only
      - run: python scripts/verify_indexed_leads.py
      - run: python scripts/verify_catalog.py --check-media
