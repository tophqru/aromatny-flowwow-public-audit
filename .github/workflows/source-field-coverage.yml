name: Flowwow source-field coverage report
on:
  push:
    branches:
      - audit/chatgpt-description-recovery-20261031
    paths:
      - catalog/public-snapshot.json
      - catalog/cards/**
      - scripts/report_source_field_gaps.py
      - .github/workflows/source-field-coverage.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
      - name: Verify per-card equality and report missing source fields
        run: python3 scripts/report_source_field_gaps.py
      - name: Upload auditable coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowwow-source-field-coverage
          path: source-field-coverage.json
          if-no-files-found: error
          retention-days: 14
